<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5C3A21" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g id="cat_waving" filter="url(#soft-shadow)">
    <!-- Tail -->
    <path d="M 125 118 Q 145 110 142 92 Q 138 82 130 90 Q 124 98 122 110" fill="#FFA834" stroke="#3A2312" stroke-width="3" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M 52 105 Q 40 120 44 136 Q 48 144 70 145 L 98 145 Q 120 144 124 136 Q 128 120 116 105 Z" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
    <!-- Feet -->
    <ellipse cx="64" cy="144" rx="10" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <ellipse cx="104" cy="144" rx="10" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <!-- Head Base -->
    <ellipse cx="84" cy="78" rx="42" ry="34" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
    <!-- Ears -->
    <!-- Left Ear (white with orange patch) -->
    <path d="M 50 60 Q 42 36 56 34 Q 70 42 68 56 Z" fill="#FFA834" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 52 54 Q 48 40 56 39 Q 62 45 61 54 Z" fill="#FFBDC9"/>
    <!-- Right Ear (Ginger) -->
    <path d="M 100 56 Q 98 42 112 34 Q 126 36 118 60 Z" fill="#FFA834" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 106 54 Q 105 45 112 39 Q 120 40 115 54 Z" fill="#FFBDC9"/>
    <!-- Head patch -->
    <path d="M 92 48 Q 110 52 118 64 Q 124 74 122 84 Q 108 76 96 68 Z" fill="#FFA834"/>
    <path d="M 48 64 Q 56 50 68 52 Q 62 66 52 74 Z" fill="#FFA834"/>
    <!-- Eyes (closed happy curves) -->
    <path d="M 68 76 Q 73 70 78 76" fill="none" stroke="#3A2312" stroke-width="3" stroke-linecap="round"/>
    <path d="M 90 76 Q 95 70 100 76" fill="none" stroke="#3A2312" stroke-width="3" stroke-linecap="round"/>
    <!-- Nose & Mouth -->
    <polygon points="84,80 82,78 86,78" fill="#FF8E9E"/>
    <path d="M 80 82 Q 84 86 84 82 Q 84 86 88 82" fill="none" stroke="#3A2312" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cheeks (Blush) -->
    <ellipse cx="62" cy="82" rx="7" ry="4.5" fill="#FF9A9E" opacity="0.6"/>
    <ellipse cx="106" cy="82" rx="7" ry="4.5" fill="#FF9A9E" opacity="0.6"/>
    <!-- Left Paw (resting) -->
    <ellipse cx="54" cy="116" rx="8" ry="7" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <!-- Right Paw (Waving up high) -->
    <g transform="translate(116, 92) rotate(-25)">
      <path d="M 0 0 C 8 -12 18 -10 20 0 C 22 10 10 16 0 8 Z" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
      <!-- Tiny wave marks -->
      <path d="M 22 -6 Q 26 -2 24 4" fill="none" stroke="#FFA834" stroke-width="2" stroke-linecap="round"/>
      <path d="M 27 -3 Q 30 1 28 6" fill="none" stroke="#FFA834" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

</svg>