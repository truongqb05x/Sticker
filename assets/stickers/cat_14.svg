    <path d="M 80 86 Q 84 82 88 86" fill="none" stroke="#3A2312" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="58" cy="84" rx="7" ry="4.5" fill="#FF9A9E" opacity="0.6"/>
    <ellipse cx="110" cy="84" rx="7" ry="4.5" fill="#FF9A9E" opacity="0.6"/>
