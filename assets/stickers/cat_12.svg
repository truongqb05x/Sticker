<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5C3A21" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g id="cat_laptop" filter="url(#soft-shadow)">
    <path d="M 52 105 Q 40 120 44 136 Q 48 144 70 145 L 98 145 Q 120 144 124 136 Q 128 120 116 105 Z" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
    <ellipse cx="84" cy="74" rx="40" ry="32" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
    <path d="M 50 56 Q 42 32 56 30 Q 70 38 68 52 Z" fill="#FFA834" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 100 52 Q 98 38 112 30 Q 126 32 118 56 Z" fill="#FFA834" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 94 46 Q 114 50 122 66 Q 112 72 98 62 Z" fill="#FFA834"/>
    <circle cx="72" cy="72" r="3" fill="#3A2312"/>
    <circle cx="96" cy="72" r="3" fill="#3A2312"/>
    <path d="M 80 78 Q 84 82 84 78 Q 84 82 88 78" fill="none" stroke="#3A2312" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="64" cy="78" rx="6" ry="4" fill="#FF9A9E" opacity="0.6"/>
    <ellipse cx="104" cy="78" rx="6" ry="4" fill="#FF9A9E" opacity="0.6"/>
    <!-- Laptop screen & keyboard -->
    <g transform="translate(56, 108)">
      <!-- Screen angled -->
      <polygon points="0,22 10,2 42,2 52,22" fill="#37474F" stroke="#3A2312" stroke-width="2.5"/>
      <polygon points="4,20 12,5 40,5 48,20" fill="#ECEFF1"/>
      <!-- Tiny Sticker Logo on screen back -->
      <circle cx="26" cy="12" r="3" fill="#FFA834"/>
      <!-- Keyboard Base -->
      <polygon points="-4,22 56,22 52,32 0,32" fill="#263238" stroke="#3A2312" stroke-width="2"/>
    </g>
    <!-- Paws on keyboard -->
    <ellipse cx="62" cy="128" rx="6" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2"/>
    <ellipse cx="106" cy="128" rx="6" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2"/>
  </g>

</svg>