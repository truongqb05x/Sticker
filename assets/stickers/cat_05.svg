<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5C3A21" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g id="cat_boba" filter="url(#soft-shadow)">
    <!-- Body -->
    <path d="M 52 105 Q 40 120 44 136 Q 48 144 70 145 L 98 145 Q 120 144 124 136 Q 128 120 116 105 Z" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
    <ellipse cx="64" cy="144" rx="10" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <ellipse cx="104" cy="144" rx="10" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <!-- Head Base -->
    <ellipse cx="80" cy="74" rx="38" ry="32" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
    <path d="M 48 56 Q 40 32 54 30 Q 68 38 66 52 Z" fill="#FFA834" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 50 50 Q 46 36 54 35 Q 60 41 59 50 Z" fill="#FFBDC9"/>
    <path d="M 94 52 Q 92 38 106 30 Q 120 32 112 56 Z" fill="#FFA834" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 100 50 Q 99 41 106 35 Q 114 36 109 50 Z" fill="#FFBDC9"/>
    <!-- Face -->
    <circle cx="66" cy="72" r="3" fill="#3A2312"/>
    <circle cx="86" cy="72" r="3" fill="#3A2312"/>
    <ellipse cx="58" cy="78" rx="6" ry="4" fill="#FF9A9E" opacity="0.6"/>
    <ellipse cx="94" cy="78" rx="6" ry="4" fill="#FF9A9E" opacity="0.6"/>
    <!-- Boba Cup -->
    <g transform="translate(90, 80)">
      <!-- Straw -->
      <line x1="16" y1="-8" x2="6" y2="35" stroke="#FFA834" stroke-width="4" stroke-linecap="round"/>
      <!-- Cup Body -->
      <path d="M 0 10 L 26 10 L 22 46 L 4 46 Z" fill="#FCEAD2" stroke="#3A2312" stroke-width="2.5"/>
      <ellipse cx="13" cy="10" rx="13" ry="3" fill="#FFFFFF" stroke="#3A2312" stroke-width="2"/>
      <!-- Boba pearls -->
      <circle cx="9" cy="40" r="2.5" fill="#3A2312"/>
      <circle cx="16" cy="41" r="2.5" fill="#3A2312"/>
      <circle cx="12" cy="35" r="2.5" fill="#3A2312"/>
      <!-- Paws holding cup -->
      <ellipse cx="0" cy="24" rx="5" ry="6" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.2"/>
      <ellipse cx="24" cy="24" rx="5" ry="6" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.2"/>
    </g>
  </g>

</svg>