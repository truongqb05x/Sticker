    <ellipse cx="58" cy="80" rx="8" ry="5" fill="#FF9A9E" opacity="0.7"/>
    <ellipse cx="110" cy="80" rx="8" ry="5" fill="#FF9A9E" opacity="0.7"/>
    <!-- Hands on cheeks -->
    <ellipse cx="54" cy="88" rx="7" ry="6" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <ellipse cx="114" cy="88" rx="7" ry="6" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
  </g>

