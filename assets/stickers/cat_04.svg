    <ellipse cx="102" cy="98" rx="7" ry="6" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <!-- Cardboard Box -->
    <path d="M 40 98 L 128 98 L 122 144 L 46 144 Z" fill="#C69466" stroke="#3A2312" stroke-width="3"/>
    <!-- Box Flaps -->
    <path d="M 40 98 L 26 86 L 46 94 Z" fill="#DEAB7D" stroke="#3A2312" stroke-width="2.5"/>
    <path d="M 128 98 L 142 86 L 122 94 Z" fill="#DEAB7D" stroke="#3A2312" stroke-width="2.5"/>
    <!-- Tape / detail on box -->
