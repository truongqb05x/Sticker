    <path d="M 70 72 Q 74 66 78 72" fill="none" stroke="#3A2312" stroke-width="3" stroke-linecap="round"/>
    <path d="M 90 72 Q 94 66 98 72" fill="none" stroke="#3A2312" stroke-width="3" stroke-linecap="round"/>
    <polygon points="84,76 82,74 86,74" fill="#FF8E9E"/>
