    <!-- Open happy smile -->
    <path d="M 80 82 Q 84 90 88 82" fill="#E64A38" stroke="#3A2312" stroke-width="2.2"/>
    <ellipse cx="60" cy="80" rx="7" ry="4.5" fill="#FF9A9E" opacity="0.6"/>
    <ellipse cx="108" cy="80" rx="7" ry="4.5" fill="#FF9A9E" opacity="0.6"/>
    <ellipse cx="64" cy="116" rx="8" ry="6" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <ellipse cx="104" cy="116" rx="8" ry="6" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
  </g>

</svg>