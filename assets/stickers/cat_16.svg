<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5C3A21" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g id="cat_wink" filter="url(#soft-shadow)">
    <path d="M 52 105 Q 40 120 44 136 Q 48 144 70 145 L 98 145 Q 120 144 124 136 Q 128 120 116 105 Z" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
    <ellipse cx="64" cy="144" rx="10" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <ellipse cx="104" cy="144" rx="10" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <ellipse cx="84" cy="78" rx="42" ry="34" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
    <path d="M 50 60 Q 42 36 56 34 Q 70 42 68 56 Z" fill="#FFA834" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 100 56 Q 98 42 112 34 Q 126 36 118 60 Z" fill="#FFA834" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 94 50 Q 114 54 122 70 Q 112 76 98 66 Z" fill="#FFA834"/>
    <!-- Left eye open -->
    <circle cx="70" cy="74" r="3.5" fill="#3A2312"/>
