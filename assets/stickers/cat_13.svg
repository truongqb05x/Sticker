<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5C3A21" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g id="cat_chick" filter="url(#soft-shadow)">
    <!-- Tiny Chick on head -->
    <g transform="translate(84, 38)">
      <circle cx="0" cy="0" r="10" fill="#FFEB3B" stroke="#3A2312" stroke-width="2"/>
      <!-- Beak -->
      <polygon points="-1,1 4,-1 -1,-3" fill="#FF9800" stroke="#3A2312" stroke-width="1.2"/>
      <!-- Chick Eye -->
      <circle cx="-3" cy="-2" r="1.3" fill="#3A2312"/>
      <!-- Tiny tuft -->
      <path d="M 0 -10 Q 2 -14 0 -15" stroke="#FF9800" stroke-width="1.8" fill="none"/>
    </g>
    <path d="M 52 105 Q 40 120 44 136 Q 48 144 70 145 L 98 145 Q 120 144 124 136 Q 128 120 116 105 Z" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
    <ellipse cx="64" cy="144" rx="10" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <ellipse cx="104" cy="144" rx="10" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <ellipse cx="84" cy="78" rx="42" ry="34" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
    <path d="M 50 60 Q 42 36 56 34 Q 70 42 68 56 Z" fill="#FFA834" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 100 56 Q 98 42 112 34 Q 126 36 118 60 Z" fill="#FFA834" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 94 50 Q 114 54 122 70 Q 112 76 98 66 Z" fill="#FFA834"/>
    <!-- Cat looking up at chick -->
    <ellipse cx="72" cy="74" rx="3.5" ry="3.5" fill="#3A2312"/>
    <circle cx="73" cy="72.5" r="1.3" fill="#FFFFFF"/>
    <ellipse cx="96" cy="74" rx="3.5" ry="3.5" fill="#3A2312"/>
    <circle cx="97" cy="72.5" r="1.3" fill="#FFFFFF"/>
    <path d="M 80 82 Q 84 86 84 82 Q 84 86 88 82" fill="none" stroke="#3A2312" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="62" cy="82" rx="7" ry="4.5" fill="#FF9A9E" opacity="0.6"/>
    <ellipse cx="106" cy="82" rx="7" ry="4.5" fill="#FF9A9E" opacity="0.6"/>
    <ellipse cx="64" cy="116" rx="8" ry="6" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <ellipse cx="104" cy="116" rx="8" ry="6" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
  </g>

</svg>