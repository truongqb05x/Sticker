    <circle cx="16" cy="33" r="2.5" fill="#FF8A80" opacity="0.8"/>
    <circle cx="36" cy="33" r="2.5" fill="#FF8A80" opacity="0.8"/>
    <!-- Hair clip -->
    <rect x="13" y="16" width="6" height="3" rx="1.5" fill="#FF4081"/>
