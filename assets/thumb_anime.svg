  <g transform="translate(14, 12)">
    <circle cx="26" cy="28" r="22" fill="#FFFFFF" stroke="#F5D5DC" stroke-width="2"/>
    <!-- Dark brown anime hair -->
    <path d="M 8 26 C 6 8 46 8 44 26 C 44 38 42 46 38 46 C 36 34 32 30 26 30 C 20 30 16 34 14 46 C 10 46 8 38 8 26 Z" fill="#3E2723"/>
