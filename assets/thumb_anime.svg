    <!-- Bangs -->
    <path d="M 14 20 L 19 28 L 24 22 L 28 28 L 33 21 L 38 27" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="20" cy="29" rx="2.5" ry="3.5" fill="#5D4037"/>
    <circle cx="21" cy="28" r="1" fill="#FFF"/>
    <ellipse cx="32" cy="29" rx="2.5" ry="3.5" fill="#5D4037"/>
    <circle cx="33" cy="28" r="1" fill="#FFF"/>
    <!-- Smile and blush -->
