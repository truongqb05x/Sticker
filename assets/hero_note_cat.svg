<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow-note" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#553820" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g transform="rotate(-4 80 80)" filter="url(#soft-shadow-note)">
    <!-- Paper card -->
    <rect x="20" y="24" width="120" height="116" rx="18" fill="#FFFBF5" stroke="#E8DDCE" stroke-width="1.8"/>
    <!-- Cute Cat Drawing inside card -->
    <g transform="translate(15, 12)">
      <!-- Body -->
      <path d="M 40 88 Q 30 102 36 114 L 92 114 Q 98 102 88 88 Z" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.8"/>
      <!-- Head -->
      <ellipse cx="64" cy="62" rx="36" ry="28" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.8"/>
      <!-- Ears -->
      <path d="M 36 46 Q 28 24 44 22 Q 54 30 52 44 Z" fill="#FFA834" stroke="#3A2312" stroke-width="2.8"/>
      <path d="M 76 44 Q 74 30 84 22 Q 100 24 92 46 Z" fill="#FFA834" stroke="#3A2312" stroke-width="2.8"/>
      <!-- Happy eyes -->
      <path d="M 50 60 Q 55 54 60 60" fill="none" stroke="#3A2312" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M 68 60 Q 73 54 78 60" fill="none" stroke="#3A2312" stroke-width="2.8" stroke-linecap="round"/>
      <!-- Nose & Mouth -->
      <polygon points="64,65 62,63 66,63" fill="#FF8E9E"/>
      <path d="M 61 67 Q 64 70 64 67 Q 64 70 67 67" fill="none" stroke="#3A2312" stroke-width="2" stroke-linecap="round"/>
      <circle cx="46" cy="65" r="5" fill="#FF9A9E" opacity="0.6"/>
      <circle cx="82" cy="65" r="5" fill="#FF9A9E" opacity="0.6"/>
      <!-- Paws up -->
      <ellipse cx="42" cy="88" rx="6" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.2"/>
      <ellipse cx="86" cy="88" rx="6" ry="5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.2"/>
    </g>
    <!-- Paperclip on top left -->
    <path d="M 38 42 L 38 16 C 38 8 48 8 48 16 L 48 48 C 48 60 32 60 32 48 L 32 24 C 32 18 42 18 42 24 L 42 42" fill="none" stroke="#A1887F" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>