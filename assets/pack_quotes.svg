<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="100%" height="100%">
  <defs>
    <filter id="shadow-quote" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#4a3e35" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#FAF7F2"/>
  <rect x="8" y="8" width="384" height="214" rx="14" fill="#F9F3EA" stroke="#E8DDCE" stroke-width="1.5"/>
  <!-- Quote Bubble 1 -->
  <g transform="translate(30, 30)" filter="url(#shadow-quote)">
    <rect width="90" height="70" rx="18" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <polygon points="40,70 50,70 45,82" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <!-- Bear face -->
    <circle cx="45" cy="35" r="14" fill="#D7CCC8"/>
    <circle cx="34" cy="24" r="5" fill="#D7CCC8"/>
    <circle cx="56" cy="24" r="5" fill="#D7CCC8"/>
    <circle cx="40" cy="34" r="2" fill="#3A2312"/>
    <circle cx="50" cy="34" r="2" fill="#3A2312"/>
    <text x="45" y="58" font-family="Nunito, sans-serif" font-weight="800" font-size="11" fill="#3A2312" text-anchor="middle">HELLO</text>
  </g>
  <!-- Quote Bubble 2 -->
  <g transform="translate(150, 40)" filter="url(#shadow-quote)">
    <rect width="100" height="70" rx="18" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <text x="50" y="36" font-family="Nunito, sans-serif" font-weight="900" font-size="13" fill="#E64A38" text-anchor="middle">GOOD</text>
    <text x="50" y="52" font-family="Nunito, sans-serif" font-weight="900" font-size="13" fill="#E64A38" text-anchor="middle">VIBES</text>
  </g>
  <!-- Quote Bubble 3: Little Cat -->
  <g transform="translate(280, 30)" filter="url(#shadow-quote)">
    <rect width="85" height="70" rx="18" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <circle cx="42" cy="34" r="14" fill="#FFE082"/>
    <polygon points="32,24 35,14 40,24" fill="#FFA000"/>
    <polygon points="45,24 50,14 53,24" fill="#FFA000"/>
    <circle cx="38" cy="34" r="2" fill="#3A2312"/>
    <circle cx="47" cy="34" r="2" fill="#3A2312"/>
    <text x="42" y="58" font-family="Nunito, sans-serif" font-weight="800" font-size="11" fill="#3A2312" text-anchor="middle">HAPPY</text>
  </g>
</svg>