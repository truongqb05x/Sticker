<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <filter id="shadow-food" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#4A3B2A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#FBF8F2"/>
  <rect x="10" y="10" width="380" height="230" rx="12" fill="#F6EFE3" stroke="#E6DCCF" stroke-width="1.5"/>

  <!-- Sticker 1: Boba Milk Tea Cup with Straw -->
  <g transform="translate(42, 20)" filter="url(#shadow-food)">
    <path d="M 20 28 L 26 80 Q 42 88 58 80 L 64 28 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <rect x="38" y="8" width="8" height="30" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6"/>
    
    <!-- Purple/Brown Straw -->
    <rect x="38" y="8" width="8" height="28" rx="2" fill="#8E44AD"/>
    <!-- Lid -->
    <ellipse cx="42" cy="28" rx="24" ry="6" fill="#D2B4DE"/>
    
    <!-- Milk Tea Cup Body -->
    <path d="M 21 28 L 27 78 Q 42 86 57 78 L 63 28 Z" fill="#F5CBA7"/>
    <!-- Tapioca Pearls -->
    <circle cx="32" cy="74" r="3.5" fill="#3E2723"/>
    <circle cx="42" cy="76" r="3.5" fill="#3E2723"/>
    <circle cx="52" cy="74" r="3.5" fill="#3E2723"/>
    <circle cx="37" cy="68" r="3.5" fill="#3E2723"/>
    <circle cx="47" cy="68" r="3.5" fill="#3E2723"/>
    
    <!-- Cute Cup Face -->
    <circle cx="35" cy="46" r="2.5" fill="#3E2723"/>
    <circle cx="49" cy="46" r="2.5" fill="#3E2723"/>
    <path d="M 40 50 Q 42 53 44 50" stroke="#3E2723" stroke-width="1.5" fill="none"/>
    <circle cx="30" cy="49" r="2.5" fill="#F1948A"/>
    <circle cx="54" cy="49" r="2.5" fill="#F1948A"/>
  </g>

  <!-- Sticker 2: Cute Smiling Carrot -->
  <g transform="translate(155, 20)" filter="url(#shadow-food)">
    <!-- White contour -->
    <path d="M 25 22 Q 45 15 65 22 L 48 85 Q 45 88 42 85 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="45" cy="14" rx="14" ry="8" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6"/>
    
    <!-- Green carrot top leaves -->
    <path d="M 45 16 C 36 6 42 0 45 10 C 48 0 54 6 45 16 Z" fill="#4CAF50"/>
    <path d="M 38 16 C 30 10 32 4 38 12 Z" fill="#66BB6A"/>
    <path d="M 52 16 C 60 10 58 4 52 12 Z" fill="#66BB6A"/>
    
    <!-- Orange Carrot Body -->
    <path d="M 26 24 Q 45 18 64 24 L 47 84 Q 45 87 43 84 Z" fill="#FF7043"/>
    <!-- Stripes -->
    <line x1="33" y1="34" x2="42" y2="34" stroke="#D84315" stroke-width="1.5"/>
    <line x1="48" y1="46" x2="57" y2="46" stroke="#D84315" stroke-width="1.5"/>
    <line x1="38" y1="58" x2="46" y2="58" stroke="#D84315" stroke-width="1.5"/>
    
    <!-- Happy Face -->
    <circle cx="40" cy="38" r="2" fill="#2E1C14"/>
    <circle cx="50" cy="38" r="2" fill="#2E1C14"/>
    <path d="M 43 41 Q 45 44 47 41" stroke="#2E1C14" stroke-width="1.5" fill="none"/>
    <circle cx="36" cy="41" r="2" fill="#FFA726"/>
    <circle cx="54" cy="41" r="2" fill="#FFA726"/>
  </g>

  <!-- Sticker 3: Ice Cream Popsicle -->
  <g transform="translate(265, 20)" filter="url(#shadow-food)">
    <rect x="22" y="14" width="46" height="54" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10"/>
    <rect x="40" y="65" width="10" height="22" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6"/>
    
    <!-- Stick -->
    <rect x="40" y="65" width="10" height="20" rx="3" fill="#D7CCC8"/>
    <!-- Popsicle body -->
    <rect x="24" y="16" width="42" height="50" rx="16" fill="#EC407A"/>
    <!-- Drip or white bite -->
    <path d="M 24 35 Q 35 32 45 36 Q 55 30 66 35 L 66 16 L 24 16 Z" fill="#F48FB1"/>
    <!-- Sprinkles -->
    <line x1="34" y1="24" x2="38" y2="28" stroke="#FFEB3B" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="22" x2="54" y2="25" stroke="#00E676" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="30" x2="46" y2="30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Face -->
    <circle cx="39" cy="48" r="2.5" fill="#FFF"/>
    <circle cx="51" cy="48" r="2.5" fill="#FFF"/>
    <path d="M 43 53 Q 45 56 47 53" stroke="#FFF" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Sticker 4: Cute Croissant / Toast Bread -->
  <g transform="translate(42, 130)" filter="url(#shadow-food)">
    <rect x="18" y="18" width="54" height="54" rx="14" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10"/>
    <!-- Toast Body -->
    <rect x="20" y="20" width="50" height="50" rx="12" fill="#FFE0B2" stroke="#8D6E63" stroke-width="2"/>
    <rect x="36" y="32" width="18" height="18" rx="4" fill="#FFF176"/>
    <!-- Face -->
    <circle cx="38" cy="46" r="2.5" fill="#4E342E"/>
    <circle cx="52" cy="46" r="2.5" fill="#4E342E"/>
    <path d="M 42 50 Q 45 53 48 50" stroke="#4E342E" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Sticker 5: Wrapped Candy -->
  <g transform="translate(155, 130)" filter="url(#shadow-food)">
    <circle cx="45" cy="45" r="24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10"/>
    <polygon points="15,30 28,45 15,60" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8"/>
    <polygon points="75,30 62,45 75,60" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8"/>
    
    <!-- Candy Wrapper wings -->
    <polygon points="16,32 28,45 16,58" fill="#AB47BC"/>
    <polygon points="74,32 62,45 74,58" fill="#AB47BC"/>
    <!-- Candy round body -->
    <circle cx="45" cy="45" r="20" fill="#E91E63"/>
    <path d="M 33 45 Q 45 32 57 45" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <circle cx="40" cy="43" r="2" fill="#FFFFFF"/>
    <circle cx="50" cy="43" r="2" fill="#FFFFFF"/>
    <path d="M 43 47 Q 45 50 47 47" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Sticker 6: Cute Ramen Bowl -->
  <g transform="translate(265, 130)" filter="url(#shadow-food)">
    <path d="M 18 36 Q 45 80 72 36 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <rect x="34" y="70" width="22" height="6" rx="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Bowl -->
    <path d="M 20 38 Q 45 78 70 38 Z" fill="#E53935"/>
    <rect x="35" y="70" width="20" height="5" rx="2" fill="#B71C1C"/>
    <!-- Noodles & Egg -->
    <ellipse cx="45" cy="38" rx="24" ry="8" fill="#FFF59D"/>
    <!-- Egg slice -->
    <circle cx="36" cy="38" r="5" fill="#FFFFFF"/>
    <circle cx="36" cy="38" r="2.8" fill="#FFA726"/>
    <!-- Chopsticks -->
    <line x1="28" y1="22" x2="68" y2="44" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="18" x2="72" y2="40" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
