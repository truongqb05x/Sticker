<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 120" width="150" height="120">
  <defs>
    <clipPath id="natureClip">
      <rect width="150" height="120" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#natureClip)">
    <!-- Sky background -->
    <rect width="150" height="120" fill="#EAF6FD"/>

    <!-- Sun -->
    <circle cx="35" cy="30" r="12" fill="#FDE047" opacity="0.8"/>

    <!-- Mountain 1 (Snow capped) -->
    <polygon points="10,105 60,25 110,105" fill="#4B9CD3" stroke="#2B6CB0" stroke-width="2"/>
    <!-- Snow peak -->
    <polygon points="60,25 45,50 53,46 60,54 68,48 75,50" fill="#FFFFFF"/>

    <!-- Mountain 2 (Smaller) -->
    <polygon points="75,105 105,45 135,105" fill="#71B4DE" stroke="#2B6CB0" stroke-width="2"/>
    <!-- Snow peak 2 -->
    <polygon points="105,45 96,62 105,66 114,62" fill="#FFFFFF"/>

    <!-- Lake / River water -->
    <path d="M 0 95 C 40 85 90 102 150 92 L 150 120 L 0 120 Z" fill="#38BDF8"/>
    <path d="M 25 102 Q 40 99 55 102" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 85 105 Q 105 102 125 105" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Pine Trees -->
    <!-- Tree 1 -->
    <polygon points="108,88 116,70 124,88" fill="#15803D" stroke="#166534" stroke-width="1.5"/>
    <polygon points="111,76 116,62 121,76" fill="#16A34A" stroke="#166534" stroke-width="1.5"/>
    <rect x="114" y="88" width="4" height="8" fill="#78350F"/>

    <!-- Tree 2 -->
    <polygon points="124,94 133,74 142,94" fill="#15803D" stroke="#166534" stroke-width="1.5"/>
    <polygon points="127,80 133,66 139,80" fill="#16A34A" stroke="#166534" stroke-width="1.5"/>
    <rect x="131" y="94" width="4" height="6" fill="#78350F"/>

    <!-- Little Orange Camping Tent -->
    <polygon points="20,105 32,84 44,105" fill="#F97316" stroke="#9A3412" stroke-width="1.5"/>
    <polygon points="28,105 32,84 36,105" fill="#C2410C"/>
  </g>
</svg>
