<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <filter id="shadow-love" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#7B3248" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#FDF8F8"/>
  <rect x="10" y="10" width="380" height="230" rx="12" fill="#FBF0F2" stroke="#EED8DD" stroke-width="1.5"/>

  <!-- Sticker 1: Winged Heart -->
  <g transform="translate(45, 25)" filter="url(#shadow-love)">
    <!-- White border -->
    <path d="M 10 38 Q 20 18 42 28 Q 64 18 74 38 Q 80 58 42 76 Q 4 58 10 38 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <!-- Heart fill -->
    <path d="M 14 38 Q 22 22 42 30 Q 62 22 70 38 Q 76 56 42 72 Q 8 56 14 38 Z" fill="#FF4081"/>
    <path d="M 18 38 Q 24 26 42 33 Q 60 26 66 38 Q 70 52 42 66 Q 14 52 18 38 Z" fill="#F50057"/>
    <!-- Highlight -->
    <ellipse cx="26" cy="34" rx="4" ry="7" transform="rotate(-30 26 34)" fill="#FFA4D5" opacity="0.8"/>
  </g>

  <!-- Sticker 2: Cute Heart with Bow -->
  <g transform="translate(150, 25)" filter="url(#shadow-love)">
    <circle cx="42" cy="42" r="34" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10"/>
    <circle cx="42" cy="42" r="30" fill="#FFCDD2"/>
    <path d="M 28 36 C 28 28 35 24 42 30 C 49 24 56 28 56 36 C 56 46 42 54 42 54 C 42 54 28 46 28 36 Z" fill="#E53935"/>
    <circle cx="34" cy="32" r="2.5" fill="#FFF"/>
  </g>

  <!-- Sticker 3: LOVE Ribbon Badge -->
  <g transform="translate(255, 30)" filter="url(#shadow-love)">
    <rect x="10" y="15" width="85" height="42" rx="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="12" y="17" width="81" height="38" rx="10" fill="#FF4081"/>
    <text x="52" y="43" fill="#FFFFFF" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="2">LOVE</text>
  </g>

  <!-- Sticker 4: Love Letter Envelope -->
  <g transform="translate(45, 128)" filter="url(#shadow-love)">
    <rect x="10" y="16" width="75" height="52" rx="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10"/>
    <rect x="12" y="18" width="71" height="48" rx="8" fill="#FFF0F2" stroke="#E91E63" stroke-width="1.8"/>
    <!-- Flap folds -->
    <path d="M 14 20 L 47 44 L 81 20" stroke="#E91E63" stroke-width="1.8" fill="none"/>
    <path d="M 14 64 L 38 42 M 81 64 L 57 42" stroke="#F48FB1" stroke-width="1.5"/>
    <!-- Red heart wax seal -->
    <path d="M 41 40 C 41 36 44 34 47 37 C 50 34 53 36 53 40 C 53 45 47 49 47 49 C 47 49 41 45 41 40 Z" fill="#D81B60"/>
  </g>

  <!-- Sticker 5: Big Love Heart -->
  <g transform="translate(150, 125)" filter="url(#shadow-love)">
    <path d="M 15 36 C 15 20 28 14 42 24 C 56 14 69 20 69 36 C 69 56 42 74 42 74 C 42 74 15 56 15 36 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 18 36 C 18 24 28 18 42 28 C 56 18 66 24 66 36 C 66 52 42 68 42 68 C 42 68 18 52 18 36 Z" fill="#FF1744"/>
    <circle cx="28" cy="28" r="3" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Sticker 6: Pink Bear with Heart -->
  <g transform="translate(265, 125)" filter="url(#shadow-love)">
    <circle cx="42" cy="42" r="36" fill="#FFFFFF"/>
    <!-- Bear Head & Ears -->
    <circle cx="22" cy="22" r="12" fill="#F8BBD0"/>
    <circle cx="62" cy="22" r="12" fill="#F8BBD0"/>
    <circle cx="42" cy="42" r="30" fill="#F8BBD0"/>
    <ellipse cx="42" cy="48" rx="12" ry="9" fill="#FFF"/>
    <circle cx="34" cy="38" r="3" fill="#4A1525"/>
    <circle cx="50" cy="38" r="3" fill="#4A1525"/>
    <path d="M 40 45 C 40 42 41.5 41 42 42 C 42.5 41 44 42 44 45 C 44 48 42 50 42 50 C 42 50 40 48 40 45 Z" fill="#E91E63"/>
    <circle cx="25" cy="44" r="4" fill="#FF80AB" opacity="0.7"/>
    <circle cx="59" cy="44" r="4" fill="#FF80AB" opacity="0.7"/>
  </g>
</svg>
