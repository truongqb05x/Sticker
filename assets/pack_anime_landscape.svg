<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="100%" height="100%">
  <defs>
    <filter id="shadow-land" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#4a3e35" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#FAF7F2"/>
  <rect x="8" y="8" width="384" height="214" rx="14" fill="#E8F1F5" stroke="#D3E0E8" stroke-width="1.5"/>
  <!-- Landscape art -->
  <g filter="url(#shadow-land)">
    <!-- Mt Fuji -->
    <polygon points="120,180 200,60 280,180" fill="#64B5F6"/>
    <!-- Snow peak -->
    <polygon points="175,98 200,60 225,98 214,106 200,98 186,106" fill="#FFFFFF"/>
    <!-- Sun/Moon -->
    <circle cx="140" cy="80" r="28" fill="#FF8A80" opacity="0.6"/>
    <!-- Cherry Blossom branch (left) -->
    <path d="M 10 30 Q 80 60 130 50" stroke="#5D4037" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="40" r="10" fill="#F48FB1"/>
    <circle cx="85" cy="55" r="9" fill="#F48FB1"/>
    <circle cx="110" cy="45" r="11" fill="#FF80AB"/>
    <circle cx="130" cy="52" r="8" fill="#FF80AB"/>
    <!-- Torii gate -->
    <g transform="translate(180, 140)">
      <line x1="0" y1="0" x2="42" y2="0" stroke="#D32F2F" stroke-width="5" stroke-linecap="round"/>
      <line x1="4" y1="8" x2="38" y2="8" stroke="#D32F2F" stroke-width="3"/>
      <line x1="8" y1="0" x2="8" y2="42" stroke="#D32F2F" stroke-width="4"/>
      <line x1="34" y1="0" x2="34" y2="42" stroke="#D32F2F" stroke-width="4"/>
    </g>
    <!-- Clouds -->
    <path d="M 40 120 Q 55 105 75 120 Q 95 105 110 120 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M 290 100 Q 305 85 325 100 Q 345 85 360 100 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>