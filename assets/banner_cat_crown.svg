<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5C3A21" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Sparkles / Stars -->
  <g fill="#F59E0B">
    <path d="M 28 32 Q 28 40 22 40 Q 28 40 28 48 Q 28 40 34 40 Q 28 40 28 32 Z"/>
    <path d="M 172 45 Q 172 51 168 51 Q 172 51 172 57 Q 172 51 176 51 Q 172 51 172 45 Z"/>
    <circle cx="165" cy="28" r="2.5"/>
    <circle cx="36" cy="60" r="2"/>
    <circle cx="180" cy="85" r="2.5"/>
  </g>

  <!-- Cute Cat Group -->
  <g id="crownCat" filter="url(#softGlow)">
    <!-- Cat Ears -->
    <path d="M 52 75 Q 36 34 60 30 Q 82 46 80 72 Z" fill="#FFA534" stroke="#3A2312" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 56 66 Q 44 42 58 39 Q 70 50 68 64 Z" fill="#FFBDC9"/>

    <path d="M 124 72 Q 122 46 144 30 Q 168 34 152 75 Z" fill="#FFA534" stroke="#3A2312" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 136 64 Q 134 50 146 39 Q 160 42 148 66 Z" fill="#FFBDC9"/>

    <!-- Calico patches on head -->
    <path d="M 118 64 Q 148 70 156 95 Q 140 102 122 86 Z" fill="#FFA534"/>

    <!-- Cat Head -->
    <ellipse cx="102" cy="102" rx="58" ry="46" fill="#FFFFFF" stroke="#3A2312" stroke-width="4.5"/>

    <!-- Golden Crown on Head -->
    <g transform="translate(108, 16) rotate(10)">
      <path d="M 8 36 L 4 16 L 16 25 L 26 12 L 36 25 L 48 16 L 44 36 Z" fill="#FBBF24" stroke="#3A2312" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="4" cy="16" r="3" fill="#F59E0B" stroke="#3A2312" stroke-width="2"/>
      <circle cx="26" cy="12" r="3.5" fill="#EF4444" stroke="#3A2312" stroke-width="2"/>
      <circle cx="48" cy="16" r="3" fill="#F59E0B" stroke="#3A2312" stroke-width="2"/>
      <circle cx="16" cy="30" r="2.5" fill="#3B82F6"/>
      <circle cx="36" cy="30" r="2.5" fill="#10B981"/>
    </g>

    <!-- Happy Eyes (Winking / Crescent) -->
    <path d="M 78 98 Q 86 88 94 98" fill="none" stroke="#3A2312" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M 114 98 Q 122 88 130 98" fill="none" stroke="#3A2312" stroke-width="4.2" stroke-linecap="round"/>

    <!-- Cute Triangle Nose -->
    <polygon points="104,103 100,100 108,100" fill="#FF8E9E"/>

    <!-- Cute Cat Mouth (ω) -->
    <path d="M 97 106 Q 104 112 104 107 Q 104 112 111 106" fill="none" stroke="#3A2312" stroke-width="3.8" stroke-linecap="round"/>

    <!-- Rosy Blushing Cheeks -->
    <ellipse cx="68" cy="106" rx="10" ry="7" fill="#FF9A9E" opacity="0.65"/>
    <ellipse cx="138" cy="106" rx="10" ry="7" fill="#FF9A9E" opacity="0.65"/>

    <!-- Cute Whiskers -->
    <line x1="50" y1="102" x2="62" y2="104" stroke="#3A2312" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="110" x2="62" y2="108" stroke="#3A2312" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="144" y1="104" x2="156" y2="102" stroke="#3A2312" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="144" y1="108" x2="158" y2="110" stroke="#3A2312" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Little Paws resting -->
    <ellipse cx="78" cy="144" rx="12" ry="8" fill="#FFFFFF" stroke="#3A2312" stroke-width="3.5"/>
    <ellipse cx="128" cy="144" rx="12" ry="8" fill="#FFFFFF" stroke="#3A2312" stroke-width="3.5"/>
  </g>
</svg>
