<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 140" width="150" height="140">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4A2E1B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Floating 'z z z' letters -->
  <g fill="#4A2E1B" font-family="'Comfortaa', 'Nunito', sans-serif" font-weight="900">
    <text x="82" y="32" font-size="14" transform="rotate(-6 82 32)">z</text>
    <text x="96" y="24" font-size="16" transform="rotate(2 96 24)">z</text>
    <text x="112" y="15" font-size="20" transform="rotate(8 112 15)">z</text>
  </g>

  <!-- Sleeping Cat Group -->
  <g id="sleepingCat" filter="url(#softShadow)">
    <!-- Ears -->
    <path d="M 38 68 Q 28 42 46 38 Q 58 48 56 66 Z" fill="#FFA534" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 40 62 Q 32 48 44 46 Q 50 52 48 62 Z" fill="#FFBDC9"/>

    <path d="M 88 66 Q 86 48 98 38 Q 116 42 106 68 Z" fill="#FFA534" stroke="#3A2312" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 94 62 Q 92 52 98 46 Q 108 48 102 62 Z" fill="#FFBDC9"/>

    <!-- Calico patches on head -->
    <path d="M 84 62 Q 104 64 110 82 Q 98 88 86 78 Z" fill="#FFA534"/>

    <!-- Cat Head & Body Lying Flat -->
    <path d="M 32 94 Q 28 66 72 64 Q 116 66 112 94 Q 110 114 72 114 Q 34 114 32 94 Z" fill="#FFFFFF" stroke="#3A2312" stroke-width="3.5"/>

    <!-- Sleeping Eyes (curved lines) -->
    <path d="M 52 88 Q 58 94 64 88" fill="none" stroke="#3A2312" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80 88 Q 86 94 92 88" fill="none" stroke="#3A2312" stroke-width="3" stroke-linecap="round"/>

    <!-- Nose & Mouth -->
    <polygon points="72,92 69,89 75,89" fill="#FF8E9E"/>
    <path d="M 68 94 Q 72 97 72 94 Q 72 97 76 94" fill="none" stroke="#3A2312" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rosy Sleeping Cheeks -->
    <ellipse cx="46" cy="94" rx="7" ry="4.5" fill="#FF9A9E" opacity="0.7"/>
    <ellipse cx="98" cy="94" rx="7" ry="4.5" fill="#FF9A9E" opacity="0.7"/>

    <!-- Little resting front paws -->
    <ellipse cx="56" cy="108" rx="8" ry="5.5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
    <ellipse cx="88" cy="108" rx="8" ry="5.5" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.5"/>
  </g>
</svg>
