<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" rx="16" fill="#FDF3E7"/>
  <!-- Cute kawaii round face -->
  <g transform="translate(16, 16)">
    <circle cx="24" cy="24" r="22" fill="#FFFFFF" stroke="#3A2312" stroke-width="2.2"/>
    <!-- Cute open smiling eyes -->
    <ellipse cx="16" cy="20" rx="2.5" ry="3.5" fill="#3A2312"/>
    <ellipse cx="32" cy="20" rx="2.5" ry="3.5" fill="#3A2312"/>
    <!-- Eye catchlight -->
    <circle cx="15.2" cy="18.8" r="1" fill="#FFFFFF"/>
    <circle cx="31.2" cy="18.8" r="1" fill="#FFFFFF"/>
    <!-- Blush -->
    <ellipse cx="12" cy="25" rx="3.5" ry="2.2" fill="#FF8A80" opacity="0.7"/>
    <ellipse cx="36" cy="25" rx="3.5" ry="2.2" fill="#FF8A80" opacity="0.7"/>
    <!-- Open happy mouth -->
    <path d="M 20 25 Q 24 33 28 25 Z" fill="#EF4444" stroke="#3A2312" stroke-width="1.8"/>
  </g>
</svg>
