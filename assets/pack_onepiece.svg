<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <filter id="shadow-op" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#4A3B2A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#FAF7F2"/>
  <rect x="10" y="10" width="380" height="230" rx="12" fill="#F4EDE1" stroke="#E2D4C1" stroke-width="1.5"/>

  <!-- Sticker 1: Luffy with Straw Hat -->
  <g transform="translate(38, 20)" filter="url(#shadow-op)">
    <!-- White contour border -->
    <ellipse cx="45" cy="48" rx="42" ry="40" fill="#FFFFFF"/>
    <ellipse cx="45" cy="22" rx="42" ry="14" fill="#FFFFFF"/>
    
    <!-- Straw hat base -->
    <ellipse cx="45" cy="24" rx="38" ry="10" fill="#F4D03F"/>
    <path d="M 24 24 C 24 10 66 10 66 24 Z" fill="#F4D03F"/>
    <rect x="25" y="21" width="40" height="5" fill="#E74C3C"/>
    
    <!-- Luffy face & black spiky hair -->
    <circle cx="45" cy="50" r="26" fill="#FAD7A0"/>
    <!-- Hair bangs -->
    <path d="M 24 35 L 32 44 L 40 37 L 46 45 L 54 36 L 64 42" stroke="#1B2631" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Big wide iconic smile with teeth -->
    <path d="M 30 52 Q 45 68 60 52 Z" fill="#FFFFFF" stroke="#1B2631" stroke-width="2"/>
    <line x1="30" y1="52" x2="60" y2="52" stroke="#1B2631" stroke-width="1.5"/>
    <line x1="40" y1="52" x2="40" y2="60" stroke="#1B2631" stroke-width="1"/>
    <line x1="50" y1="52" x2="50" y2="60" stroke="#1B2631" stroke-width="1"/>
    <!-- Eyes -->
    <circle cx="34" cy="45" r="3" fill="#1B2631"/>
    <circle cx="56" cy="45" r="3" fill="#1B2631"/>
    <!-- Scar under left eye -->
    <path d="M 31 50 L 37 50" stroke="#C0392B" stroke-width="1.8"/>
    <!-- Red vest collar -->
    <path d="M 32 72 L 45 66 L 58 72 Z" fill="#E74C3C"/>
  </g>

  <!-- Sticker 2: Sanji Chibi -->
  <g transform="translate(145, 20)" filter="url(#shadow-op)">
    <circle cx="45" cy="45" r="38" fill="#FFFFFF"/>
    <!-- Yellow blond hair covering one eye -->
    <circle cx="45" cy="48" r="26" fill="#FAD7A0"/>
    <path d="M 22 35 Q 38 20 68 35 Q 65 55 52 50 Q 40 40 22 35 Z" fill="#F9E79F"/>
    <path d="M 25 32 Q 45 22 65 30 L 60 52 L 45 42 Z" fill="#F7DC6F"/>
    <!-- Curly eyebrow & single eye -->
    <path d="M 52 42 Q 56 38 58 42" stroke="#1B2631" stroke-width="2" fill="none"/>
    <circle cx="55" cy="46" r="3" fill="#1B2631"/>
    <!-- Cigarette & cool smirk -->
    <path d="M 40 56 Q 48 58 54 54" stroke="#1B2631" stroke-width="2" fill="none"/>
    <line x1="36" y1="58" x2="28" y2="60" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="27" cy="60.5" r="1.5" fill="#E74C3C"/>
    <!-- Black suit tie -->
    <path d="M 36 72 L 45 68 L 54 72" stroke="#1B2631" stroke-width="6"/>
  </g>

  <!-- Sticker 3: Zoro Chibi -->
  <g transform="translate(255, 20)" filter="url(#shadow-op)">
    <circle cx="45" cy="45" r="38" fill="#FFFFFF"/>
    <circle cx="45" cy="48" r="26" fill="#F5CBA7"/>
    <!-- Spiky green marimo hair -->
    <path d="M 22 42 Q 24 20 45 20 Q 66 20 68 42 Z" fill="#58D68D"/>
    <!-- Bandana or spiky locks -->
    <path d="M 28 32 L 34 22 L 42 30 L 48 20 L 56 30 L 62 25" stroke="#239B56" stroke-width="3"/>
    <!-- Determined eyes & scar -->
    <line x1="32" y1="44" x2="42" y2="47" stroke="#1B2631" stroke-width="2.5"/>
    <line x1="48" y1="47" x2="58" y2="44" stroke="#1B2631" stroke-width="2.5"/>
    <line x1="37" y1="40" x2="37" y2="49" stroke="#C0392B" stroke-width="1.8"/>
    <!-- Gritting teeth smirk -->
    <rect x="36" y="55" width="18" height="4" rx="2" fill="#FFF" stroke="#1B2631" stroke-width="1.5"/>
    <!-- Green haramaki coat -->
    <path d="M 32 72 L 45 68 L 58 72 Z" fill="#1E8449"/>
  </g>

  <!-- Sticker 4: Ace Chibi -->
  <g transform="translate(55, 128)" filter="url(#shadow-op)">
    <circle cx="45" cy="45" r="38" fill="#FFFFFF"/>
    <circle cx="45" cy="48" r="26" fill="#F5CBA7"/>
    <!-- Orange cowboy hat -->
    <ellipse cx="45" cy="28" rx="36" ry="10" fill="#E67E22"/>
    <path d="M 30 28 C 30 16 60 16 60 28 Z" fill="#D35400"/>
    <!-- Black wavy hair & freckles -->
    <path d="M 24 38 L 32 46 L 42 38 L 48 48 L 58 40 L 65 46" stroke="#17202A" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="34" cy="46" r="3" fill="#17202A"/>
    <circle cx="56" cy="46" r="3" fill="#17202A"/>
    <!-- Freckles -->
    <circle cx="28" cy="50" r="1.2" fill="#784212"/>
    <circle cx="31" cy="52" r="1.2" fill="#784212"/>
    <circle cx="59" cy="50" r="1.2" fill="#784212"/>
    <circle cx="62" cy="52" r="1.2" fill="#784212"/>
    <path d="M 36 55 Q 45 62 54 55" stroke="#17202A" stroke-width="2" fill="none"/>
  </g>

  <!-- Sticker 5: Chopper Cute Reindeer Hat -->
  <g transform="translate(165, 128)" filter="url(#shadow-op)">
    <circle cx="45" cy="45" r="38" fill="#FFFFFF"/>
    <!-- Big pink hat with white X -->
    <path d="M 22 42 C 20 18 70 18 68 42 Z" fill="#F06292"/>
    <path d="M 40 22 L 50 34 M 50 22 L 40 34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <!-- Antlers -->
    <path d="M 24 24 L 14 16 M 16 22 L 10 24" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>
    <path d="M 66 24 L 76 16 M 74 22 L 80 24" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>
    <!-- Blue nose & round face -->
    <ellipse cx="45" cy="52" rx="24" ry="18" fill="#D7CCC8"/>
    <circle cx="34" cy="48" r="3.5" fill="#212121"/>
    <circle cx="56" cy="48" r="3.5" fill="#212121"/>
    <ellipse cx="45" cy="54" rx="4.5" ry="3.5" fill="#03A9F4"/>
    <path d="M 41 58 Q 45 61 49 58" stroke="#3E2723" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Sticker 6: Straw Hat Jolly Roger -->
  <g transform="translate(265, 128)" filter="url(#shadow-op)">
    <circle cx="45" cy="45" r="38" fill="#FFFFFF"/>
    <circle cx="45" cy="45" r="32" fill="#212121"/>
    <!-- Crossbones -->
    <line x1="22" y1="22" x2="68" y2="68" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="68" y1="22" x2="22" y2="68" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Skull -->
    <circle cx="45" cy="45" r="16" fill="#FFFFFF"/>
    <circle cx="40" cy="43" r="3.5" fill="#212121"/>
    <circle cx="50" cy="43" r="3.5" fill="#212121"/>
    <!-- Hat on skull -->
    <ellipse cx="45" cy="34" rx="18" ry="4" fill="#F4D03F"/>
    <path d="M 36 34 C 36 26 54 26 54 34 Z" fill="#F4D03F"/>
    <rect x="36" y="33" width="18" height="2" fill="#E74C3C"/>
  </g>
</svg>
