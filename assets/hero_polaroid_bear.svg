<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow-polaroid" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" flood-color="#553820" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Floating heart sticker near Polaroid -->
  <path d="M 14 96 C 14 90 8 88 8 93 C 8 97 14 102 14 102 C 14 102 20 97 20 93 C 20 88 14 90 14 96 Z" fill="#E64A38"/>
  <g transform="rotate(5 90 85)" filter="url(#soft-shadow-polaroid)">
    <!-- Polaroid frame -->
    <rect x="24" y="20" width="112" height="130" rx="6" fill="#FFFDF8" stroke="#E5DACD" stroke-width="1.5"/>
    <!-- Photo inner area -->
    <rect x="34" y="30" width="92" height="90" fill="#F7EFE6"/>
    <!-- Washi tape at top -->
    <rect x="62" y="14" width="36" height="14" fill="#D7CCC8" opacity="0.8" transform="rotate(-2 80 20)"/>
    <!-- Teddy Bear Sticker -->
    <g transform="translate(40, 48)">
      <circle cx="24" cy="24" r="22" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="18" fill="#A16B47" stroke="#3A2312" stroke-width="2"/>
      <!-- Ears -->
      <circle cx="12" cy="12" r="6" fill="#A16B47" stroke="#3A2312" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="3" fill="#D7CCC8"/>
      <circle cx="36" cy="12" r="6" fill="#A16B47" stroke="#3A2312" stroke-width="1.8"/>
      <circle cx="36" cy="12" r="3" fill="#D7CCC8"/>
      <!-- Snout -->
      <ellipse cx="24" cy="27" rx="8" ry="6" fill="#EFEBE9"/>
      <circle cx="24" cy="25" r="2.5" fill="#3A2312"/>
      <!-- Eyes -->
      <circle cx="18" cy="20" r="1.8" fill="#3A2312"/>
      <circle cx="30" cy="20" r="1.8" fill="#3A2312"/>
    </g>
    <!-- Houseplant Potted Sticker -->
    <g transform="translate(86, 38)">
      <!-- Leaves -->
      <path d="M 20 30 Q 10 10 20 0 Q 30 10 20 30 Z" fill="#81C784" stroke="#3A2312" stroke-width="1.8"/>
      <path d="M 20 34 Q 35 22 40 32 Q 28 40 20 34 Z" fill="#66BB6A" stroke="#3A2312" stroke-width="1.8"/>
      <path d="M 20 40 Q 5 28 0 38 Q 12 46 20 40 Z" fill="#66BB6A" stroke="#3A2312" stroke-width="1.8"/>
      <!-- Pot -->
      <polygon points="12,50 28,50 25,72 15,72" fill="#BCAAA4" stroke="#3A2312" stroke-width="1.8"/>
    </g>
  </g>
</svg>