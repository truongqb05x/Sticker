<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="200" height="170">
  <defs>
    <filter id="promoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5C3A21" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Potted plant decor in bottom right -->
  <g transform="translate(160, 115)">
    <path d="M 6 22 L 2 38 L 22 38 L 18 22 Z" fill="#D7A179" stroke="#3A2312" stroke-width="2.5"/>
    <!-- Leaves -->
    <path d="M 10 22 C 4 14 6 4 14 8 C 14 16 12 20 10 22 Z" fill="#65A30D" stroke="#3A2312" stroke-width="2"/>
    <path d="M 12 22 C 16 12 26 14 22 22 Z" fill="#84CC16" stroke="#3A2312" stroke-width="2"/>
  </g>

  <!-- Tiny floating heart and sparkles -->
  <path d="M 152 48 C 152 42 146 40 146 45 C 146 49 152 53 152 53 C 152 53 158 49 158 45 C 158 40 152 42 152 48 Z" fill="#EF4444"/>
  <circle cx="42" cy="48" r="2.5" fill="#F59E0B"/>
  <circle cx="166" cy="78" r="2" fill="#F59E0B"/>
  <path d="M 36 78 Q 36 84 32 84 Q 36 84 36 90 Q 36 84 40 84 Q 36 84 36 78 Z" fill="#F59E0B"/>

  <!-- Main Cat hugging Heart -->
  <g id="catHuggingHeart" filter="url(#promoShadow)">
    <!-- Ears -->
    <path d="M 60 48 Q 48 18 68 14 Q 84 28 82 48 Z" fill="#FFA534" stroke="#3A2312" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 64 42 Q 54 24 65 22 Q 74 30 72 40 Z" fill="#FFBDC9"/>

    <path d="M 118 48 Q 116 28 132 14 Q 152 18 140 48 Z" fill="#FFA534" stroke="#3A2312" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 128 40 Q 126 30 135 22 Q 146 24 136 42 Z" fill="#FFBDC9"/>

    <!-- Calico patch -->
    <path d="M 114 44 Q 136 48 142 66 Q 130 70 118 58 Z" fill="#FFA534"/>

    <!-- Head -->
    <ellipse cx="100" cy="68" rx="44" ry="34" fill="#FFFFFF" stroke="#3A2312" stroke-width="3.8"/>

    <!-- Happy Eyes -->
    <path d="M 82 65 Q 88 57 94 65" fill="none" stroke="#3A2312" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 108 65 Q 114 57 120 65" fill="none" stroke="#3A2312" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Little Nose & Mouth -->
    <polygon points="101,70 98,67 104,67" fill="#FF8E9E"/>
    <path d="M 96 72 Q 101 76 101 73 Q 101 76 106 72" fill="none" stroke="#3A2312" stroke-width="3" stroke-linecap="round"/>

    <!-- Cheeks -->
    <ellipse cx="76" cy="72" rx="8" ry="5" fill="#FF9A9E" opacity="0.65"/>
    <ellipse cx="126" cy="72" rx="8" ry="5" fill="#FF9A9E" opacity="0.65"/>

    <!-- Whiskers -->
    <line x1="60" y1="70" x2="70" y2="71" stroke="#3A2312" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="76" x2="69" y2="74" stroke="#3A2312" stroke-width="2" stroke-linecap="round"/>
    <line x1="131" y1="71" x2="141" y2="70" stroke="#3A2312" stroke-width="2" stroke-linecap="round"/>
    <line x1="131" y1="74" x2="143" y2="76" stroke="#3A2312" stroke-width="2" stroke-linecap="round"/>

    <!-- Big Red Heart Being Hugged -->
    <path d="M 100 135 C 70 115 56 94 68 84 C 78 76 92 82 100 92 C 108 82 122 76 132 84 C 144 94 130 115 100 135 Z" fill="#EF4444" stroke="#3A2312" stroke-width="3.5"/>
    <!-- Heart shine -->
    <path d="M 76 86 C 72 88 72 94 74 98" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

    <!-- Paws Hugging Heart -->
    <ellipse cx="74" cy="98" rx="8" ry="11" transform="rotate(-20 74 98)" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
    <ellipse cx="126" cy="98" rx="8" ry="11" transform="rotate(20 126 98)" fill="#FFFFFF" stroke="#3A2312" stroke-width="3"/>
  </g>
</svg>
