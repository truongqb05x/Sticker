<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="100%" height="100%">
  <defs>
    <filter id="shadow-hall" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#4a3e35" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#FAF7F2"/>
  <rect x="8" y="8" width="384" height="214" rx="14" fill="#F7EFE8" stroke="#E5D9CE" stroke-width="1.5"/>
  <!-- Pumpkin Jack-o-lantern -->
  <g transform="translate(30, 45)" filter="url(#shadow-hall)">
    <circle cx="45" cy="50" r="38" fill="#FFFFFF"/>
    <ellipse cx="45" cy="50" rx="34" ry="30" fill="#FF9800" stroke="#3A2312" stroke-width="2.5"/>
    <!-- Stem -->
    <path d="M 42 20 L 45 10 L 50 12 L 48 20 Z" fill="#4CAF50" stroke="#3A2312" stroke-width="2"/>
    <!-- Eyes -->
    <polygon points="34,42 40,48 30,48" fill="#3A2312"/>
    <polygon points="56,42 60,48 50,48" fill="#3A2312"/>
    <!-- Smile -->
    <path d="M 32 58 L 38 64 L 44 58 L 50 64 L 58 58" fill="none" stroke="#3A2312" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Black Witch Cat -->
  <g transform="translate(125, 45)" filter="url(#shadow-hall)">
    <circle cx="45" cy="50" r="38" fill="#FFFFFF"/>
    <ellipse cx="45" cy="54" rx="30" ry="26" fill="#424242" stroke="#3A2312" stroke-width="2.5"/>
    <polygon points="26,36 30,18 40,32" fill="#424242" stroke="#3A2312" stroke-width="2"/>
    <polygon points="50,32 60,18 64,36" fill="#424242" stroke="#3A2312" stroke-width="2"/>
    <!-- Yellow glowing eyes -->
    <ellipse cx="36" cy="50" rx="4" ry="6" fill="#FFEB3B"/>
    <circle cx="36" cy="50" r="2" fill="#3A2312"/>
    <ellipse cx="54" cy="50" rx="4" ry="6" fill="#FFEB3B"/>
    <circle cx="54" cy="50" r="2" fill="#3A2312"/>
    <polygon points="45,58 43,56 47,56" fill="#FF8A80"/>
  </g>
  <!-- Cute Ghost -->
  <g transform="translate(220, 45)" filter="url(#shadow-hall)">
    <circle cx="45" cy="50" r="38" fill="#FFFFFF"/>
    <path d="M 24 50 C 24 24 66 24 66 50 C 66 74 60 76 54 70 C 48 76 42 70 36 76 C 30 70 24 74 24 50 Z" fill="#EDE7F6" stroke="#3A2312" stroke-width="2.5"/>
    <ellipse cx="38" cy="46" rx="3" ry="4" fill="#3A2312"/>
    <ellipse cx="52" cy="46" rx="3" ry="4" fill="#3A2312"/>
    <ellipse cx="45" cy="56" rx="4" ry="5" fill="#3A2312"/>
    <ellipse cx="32" cy="52" rx="4" ry="3" fill="#FFAB91" opacity="0.7"/>
    <ellipse cx="58" cy="52" rx="4" ry="3" fill="#FFAB91" opacity="0.7"/>
  </g>
  <!-- Bat / Candy -->
  <g transform="translate(305, 50)" filter="url(#shadow-hall)">
    <circle cx="40" cy="45" r="34" fill="#FFFFFF"/>
    <path d="M 16 45 C 24 30 34 38 40 45 C 46 38 56 30 64 45 C 54 52 48 48 40 56 C 32 48 26 52 16 45 Z" fill="#7E57C2" stroke="#3A2312" stroke-width="2"/>
    <circle cx="36" cy="46" r="2" fill="#FFEB3B"/>
    <circle cx="44" cy="46" r="2" fill="#FFEB3B"/>
  </g>
</svg>