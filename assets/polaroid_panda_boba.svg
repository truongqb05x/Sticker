<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <defs>
    <filter id="softShadowPanda" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4A2E1B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g id="pandaBoba" filter="url(#softShadowPanda)">
    <!-- Panda Round Black Ears -->
    <circle cx="48" cy="40" r="14" fill="#2D231E" stroke="#1F1612" stroke-width="2"/>
    <circle cx="102" cy="40" r="14" fill="#2D231E" stroke="#1F1612" stroke-width="2"/>

    <!-- Panda Head -->
    <ellipse cx="75" cy="68" rx="42" ry="36" fill="#FFFFFF" stroke="#2D231E" stroke-width="3.5"/>

    <!-- Black Eye Patches -->
    <ellipse cx="58" cy="66" rx="11" ry="13" transform="rotate(-15 58 66)" fill="#2D231E"/>
    <ellipse cx="92" cy="66" rx="11" ry="13" transform="rotate(15 92 66)" fill="#2D231E"/>

    <!-- Cute Eyes -->
    <circle cx="60" cy="65" r="3.5" fill="#FFFFFF"/>
    <circle cx="90" cy="65" r="3.5" fill="#FFFFFF"/>
    <circle cx="61" cy="64.5" r="1.5" fill="#2D231E"/>
    <circle cx="89" cy="64.5" r="1.5" fill="#2D231E"/>

    <!-- Little Panda Nose -->
    <ellipse cx="75" cy="74" rx="4.5" ry="3" fill="#2D231E"/>

    <!-- Blushing cheeks -->
    <ellipse cx="44" cy="76" rx="6" ry="4" fill="#FF8A80" opacity="0.65"/>
    <ellipse cx="106" cy="76" rx="6" ry="4" fill="#FF8A80" opacity="0.65"/>

    <!-- Boba Cup Held by Panda Paws -->
    <g transform="translate(56, 80)">
      <!-- Straw -->
      <line x1="18" y1="-8" x2="19" y2="28" stroke="#4B382A" stroke-width="4.5" stroke-linecap="round"/>
      
      <!-- Cup Body -->
      <path d="M 4 8 L 8 46 Q 19 50 30 46 L 34 8 Z" fill="#F4D3B4" stroke="#2D231E" stroke-width="3"/>
      <!-- Cup Lid -->
      <ellipse cx="19" cy="8" rx="16" ry="4" fill="#FFFFFF" stroke="#2D231E" stroke-width="2.5"/>

      <!-- Tapioca Pearls / Boba -->
      <circle cx="12" cy="40" r="3" fill="#3D271D"/>
      <circle cx="19" cy="42" r="3" fill="#3D271D"/>
      <circle cx="26" cy="39" r="3" fill="#3D271D"/>
      <circle cx="15" cy="34" r="2.8" fill="#3D271D"/>
      <circle cx="23" cy="33" r="2.8" fill="#3D271D"/>
    </g>

    <!-- Panda Arms holding Cup -->
    <ellipse cx="50" cy="98" rx="8" ry="12" transform="rotate(35 50 98)" fill="#2D231E"/>
    <ellipse cx="100" cy="98" rx="8" ry="12" transform="rotate(-35 100 98)" fill="#2D231E"/>
  </g>
</svg>
